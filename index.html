<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bastien Piechon — iOS Apps</title>
  <meta name="description" content="iOS apps by Bastien Piechon">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px;
      color: #1a1a1a;
      line-height: 1.6;
      background: #fafafa;
    }
    header { margin-bottom: 64px; }
    h1 {
      font-size: 42px;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }
    .tagline {
      color: #666;
      font-size: 18px;
      margin: 0;
    }
    h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #888;
      margin-top: 56px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .apps {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .app-card {
      background: white;
      border: 1px solid #eaeaea;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .app-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }
    .app-card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .app-name {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #1a1a1a;
    }
    .app-desc {
      color: #666;
      margin: 0;
      font-size: 15px;
    }
    .app-links {
      margin-top: 12px;
      font-size: 14px;
    }
    .app-links a {
      color: #0066cc;
      margin-right: 16px;
      text-decoration: none;
    }
    .app-links a:hover { text-decoration: underline; }
    footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid #eaeaea;
      color: #888;
      font-size: 14px;
    }
    footer a { color: #0066cc; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>Bastien Piechon</h1>
    <p class="tagline">Building small, focused iOS apps from France.</p>
  </header>

  <h2>Apps</h2>
  <ul class="apps">
    <li class="app-card">
      <a href="pulse/">
        <p class="app-name">Pulse</p>
        <p class="app-desc">A fast-paced rhythm puzzle game. Available on the App Store.</p>
      </a>
      <p class="app-links">
        <a href="pulse/">Support</a>
        <a href="pulse/privacy.html">Privacy Policy</a>
        <a href="https://apps.apple.com/us/app/pulse-beat/id6762782294" target="_blank" rel="noopener">App Store</a>
      </p>
    </li>
  </ul>

  <footer>
    <p>Get in touch: <a href="mailto:bastien.piechon@icloud.com">bastien.piechon@icloud.com</a></p>
    <p>© 2025 Bastien Piechon</p>
  </footer>
</body>
</html>
